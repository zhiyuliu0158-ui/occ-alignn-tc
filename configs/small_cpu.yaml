model:
  hidden_dim: 32
  element_emb_dim: 24
  num_layers: 1
  dropout: 0.05
  max_species_per_site: 4
  cutoff_radius: 5.0
  max_neighbors: 6
  n_edge_rbf: 16
  n_angle_rbf: 8
  use_explicit_triplet: true
  use_pressure_field_film: true
  use_max_pool: false

training:
  batch_size: 2
  epochs: 2
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  early_stopping_patience: 5
  seed: 7
  regression_loss: gaussian_nll
  scheduler: reduce_on_plateau
  num_workers: 0

data:
  split_column: split
  group_column: parent_cif_id
  frac_coord_tol: 0.0001
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15

