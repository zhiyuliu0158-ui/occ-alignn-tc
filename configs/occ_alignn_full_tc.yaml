model:
  hidden_dim: 192
  element_emb_dim: 96
  num_layers: 6
  dropout: 0.1
  max_species_per_site: 4
  cutoff_radius: 8.0
  max_neighbors: 12
  n_edge_rbf: 80
  n_angle_rbf: 40
  use_explicit_triplet: true
  use_pressure_field_film: true
  use_max_pool: true

training:
  batch_size: 8
  epochs: 200
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  early_stopping_patience: 30
  seed: 42
  regression_loss: gaussian_nll
  scheduler: reduce_on_plateau
  num_workers: 0

data:
  split_column: split
  group_column: parent_cif_id
  frac_coord_tol: 0.0001
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1

